name: Release

# Tag driven:
#   1.2.3 / v1.2.3        stable release, the tagged commit must be on main
#   1.2.3-rc / 1.2.3-rc.1 release candidate (GitHub pre-release), the tagged commit must be on develop
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/Gheychi.App/Gheychi.App.csproj

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and branch
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-rc([.-]?[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$tag' is not a release (1.2.3) or release candidate (1.2.3-rc, 1.2.3-rc.1)."
            exit 1
          fi

          version="${tag#v}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            channel=rc
            branch=develop
          else
            channel=stable
            branch=main
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::Tag '$tag' is a $channel tag, so its commit must be on '$branch'. It is not."
            exit 1
          fi

          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$([[ $channel == rc ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Core tests
        run: dotnet test tests/Gheychi.Core.Tests -c Release

      - name: Decode signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. The APK will be signed with the debug key, which cannot be upgraded by a differently signed build."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(
            -c Release
            -f net10.0-android
            -p:AndroidPackageFormat=apk
            -p:ApplicationDisplayVersion="${{ steps.tag.outputs.version }}"
            -p:ApplicationVersion="${{ github.run_number }}"
            -p:InstallAndroidDependencies=true
            -p:AcceptAndroidSDKLicenses=True
            -p:AndroidSdkDirectory="${ANDROID_HOME}"
          )

          if [[ -n "$KEYSTORE_PATH" ]]; then
            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
            )
          fi

          dotnet publish "$APP_PROJECT" "${args[@]}"

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          dir=src/Gheychi.App/bin/Release/net10.0-android/publish
          apk=$(ls "$dir"/*-Signed.apk 2>/dev/null | head -n 1 || true)
          if [[ -z "$apk" ]]; then
            apk=$(ls "$dir"/*.apk 2>/dev/null | head -n 1 || true)
          fi
          if [[ -z "$apk" ]]; then
            echo "::error::No APK found in $dir"
            exit 1
          fi

          out="$RUNNER_TEMP/Gheychi-${{ steps.tag.outputs.version }}.apk"
          cp "$apk" "$out"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Gheychi-${{ steps.tag.outputs.version }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
            if [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]]; then
              flags+=(--prerelease)
            else
              flags+=(--latest)
            fi
            gh release create "$TAG" "$APK" "$APK.sha256" "${flags[@]}"
          fi
