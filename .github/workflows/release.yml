name: Release

# Tag driven:
#   1.2.3 / v1.2.3        stable release, the tagged commit must be on main
#   1.2.3-rc / 1.2.3-rc.1 release candidate (GitHub pre-release), the tagged commit must be on develop
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/Gheychi.App/Gheychi.App.csproj
  # rid:abi of each single-ABI APK released next to the universal one; the RuntimeIdentifiers of the app project
  # and GitHubAppReleaseSource.Abis.
  ANDROID_ABIS: android-arm:armeabi-v7a android-arm64:arm64-v8a android-x86:x86 android-x64:x86_64

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and branch
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)(-rc([.-]?[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$tag' is not a release (1.2.3) or release candidate (1.2.3-rc, 1.2.3-rc.1)."
            exit 1
          fi

          version="${tag#v}"
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            channel=rc
            branch=develop
          else
            channel=stable
            branch=main
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::Tag '$tag' is a $channel tag, so its commit must be on '$branch'. It is not."
            exit 1
          fi

          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$([[ $channel == rc ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android workload
        run: dotnet workload install android

      - name: Core tests
        run: dotnet test tests/Gheychi.Core.Tests -c Release

      # The spam model is not in git: bundle the latest one the dataset repository released, whatever is on disk.
      - name: Fetch latest spam model
        id: model
        shell: bash
        env:
          MODEL_REPO: MahdiyarGHD/sms-spam-dataset
        run: |
          dir=src/Gheychi.App/Assets/SpamModel
          rm -rf "$dir" && mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/manifest.json" "https://github.com/$MODEL_REPO/releases/latest/download/manifest.json"
          version=$(jq -er .version "$dir/manifest.json")
          model=$(jq -er .model "$dir/manifest.json")
          curl -fsSL --retry 3 -o "$dir/$model" "https://github.com/$MODEL_REPO/releases/download/model-v$version/$model"
          echo "$(jq -er .sha256 "$dir/manifest.json")  $dir/$model" | sha256sum -c -
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. The APKs will be signed with the debug key, which cannot be upgraded by a differently signed build."
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          path="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish APKs
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(
            -c Release
            -f net10.0-android
            -p:AndroidPackageFormat=apk
            -p:ApplicationDisplayVersion="${{ steps.tag.outputs.version }}"
            -p:ApplicationVersion="${{ github.run_number }}"
            -p:InstallAndroidDependencies=true
            -p:AcceptAndroidSDKLicenses=True
            -p:AndroidSdkDirectory="${ANDROID_HOME}"
          )

          if [[ -n "$KEYSTORE_PATH" ]]; then
            args+=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$KEYSTORE_PATH"
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
            )
          fi

          # The universal APK first, then one per ABI. All share the version code, so an update installs over any of
          # them, whichever ABI it is built for.
          dotnet publish "$APP_PROJECT" "${args[@]}"
          for pair in $ANDROID_ABIS; do
            dotnet publish "$APP_PROJECT" "${args[@]}" -r "${pair%%:*}"
          done

      - name: Collect APKs
        id: apk
        shell: bash
        run: |
          version="${{ steps.tag.outputs.version }}"
          bin=src/Gheychi.App/bin/Release/net10.0-android
          out="$RUNNER_TEMP/apks"
          mkdir -p "$out"

          # $1 publish directory, $2 release file name, $3 the ABIs the APK must hold (sorted, space separated).
          collect() {
            local apk abis
            apk=$(ls "$1"/*-Signed.apk 2>/dev/null | head -n 1 || true)
            if [[ -z "$apk" ]]; then
              apk=$(ls "$1"/*.apk 2>/dev/null | head -n 1 || true)
            fi
            if [[ -z "$apk" ]]; then
              echo "::error::No APK found in $1"
              exit 1
            fi
            abis=$(zipinfo -1 "$apk" | { grep '^lib/' || true; } | cut -d/ -f2 | sort -u | xargs)
            if [[ "$abis" != "$3" ]]; then
              echo "::error::$2 holds the ABIs '$abis', not '$3'"
              exit 1
            fi
            cp "$apk" "$out/$2"
            (cd "$out" && sha256sum "$2" > "$2.sha256")
          }

          # The in-app updater downloads these by name (GitHubAppReleaseSource.ApkUrl): the APK for the phone's ABI,
          # else the universal one.
          collect "$bin/publish" "Gheychi-$version.apk" "$(for pair in $ANDROID_ABIS; do echo "${pair#*:}"; done | sort | xargs)"
          for pair in $ANDROID_ABIS; do
            collect "$bin/${pair%%:*}/publish" "Gheychi-$version-${pair#*:}.apk" "${pair#*:}"
          done

          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Gheychi-${{ steps.tag.outputs.version }}
          path: ${{ steps.apk.outputs.dir }}

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DIR: ${{ steps.apk.outputs.dir }}
        run: |
          files=("$DIR"/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="Bundled spam model v${{ steps.model.outputs.version }}"
            notes+=$'\n\n'"Gheychi-${{ steps.tag.outputs.version }}.apk installs on any phone. The others are smaller, each for one processor type: arm64-v8a for most phones, armeabi-v7a for older 32-bit ones, x86_64 and x86 for emulators."
            flags=(--verify-tag --generate-notes --title "$TAG" --notes "$notes")
            if [[ "${{ steps.tag.outputs.prerelease }}" == "true" ]]; then
              flags+=(--prerelease)
            else
              flags+=(--latest)
            fi
            gh release create "$TAG" "${files[@]}" "${flags[@]}"
          fi
